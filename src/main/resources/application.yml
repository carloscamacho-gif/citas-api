server:
  port: ${API_PORT:8080}

spring:
  application:
    name: citas-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas_fcv_training}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota
    username: ${DB_USER:citas_app}
    password: ${DB_PASSWORD:CHANGE_ME}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:CHANGE_ME_ACCESS_SECRET_MIN_32_CHARS}
    refresh-secret: ${JWT_REFRESH_SECRET:CHANGE_ME_REFRESH_SECRET_MIN_32_CHARS}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:4200}
  # HU-003: recuperación de contraseña. `expose-token` es una facilidad de LABORATORIO (sin SMTP) que
  # devuelve el token en la respuesta y lo registra en log; debe ser `false` en un entorno real.
  password-reset:
    minutes: ${PASSWORD_RESET_MINUTES:30}
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
